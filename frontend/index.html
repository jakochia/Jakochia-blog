<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ============================================ -->
    <!-- FAVICONS (Google prefers PNG 48x48 and up) -->
    <!-- ============================================ -->
    <!-- Primary PNG favicons for Google Search -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    
    <!-- SVG for modern browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Legacy fallbacks -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Apple Touch Icon (iOS / Safari) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- ============================================ -->
    <!-- SEO & SOCIAL SHARING -->
    <!-- ============================================ -->
    <title>Jakochia Blog – Code. Build. Learn. Share.</title>
    <meta name="description" content="Code. Build. Learn. Share. – Exploring software engineering, networking, cybersecurity, AI and technology. By Newton Asha." />
    <meta name="keywords" content="software engineering, networking, cybersecurity, AI, programming, Cisco, tutorials, developer projects, cloud computing" />
    <meta name="author" content="Newton Asha (Jakochia)" />
    <link rel="canonical" href="https://blog.jakochia.co.ke" />
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Jakochia Blog – Code. Build. Learn. Share." />
    <meta property="og:description" content="Exploring software engineering, networking, cybersecurity, AI and technology. By Newton Asha." />
    <meta property="og:image" content="https://blog.jakochia.co.ke/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://blog.jakochia.co.ke" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jakochia Blog" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jakochia Blog – Code. Build. Learn. Share." />
    <meta name="twitter:description" content="Exploring software engineering, networking, cybersecurity, AI and technology. By Newton Asha." />
    <meta name="twitter:image" content="https://blog.jakochia.co.ke/og-image.jpg" />
    <meta name="twitter:site" content="@jakochia" />
    
    <!-- ============================================ -->
    <!-- THEME COLOR (for mobile browsers) -->
    <!-- ============================================ -->
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
