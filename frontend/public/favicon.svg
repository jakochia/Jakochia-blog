<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Royal Blue Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3B7D" />
      <stop offset="100%" stop-color="#4169E1" />
    </linearGradient>
    <radialGradient id="spotlight1_1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spotlight1_2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#1A3B7D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A3B7D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0A1A3A" flood-opacity="0.6" />
    </filter>
    <filter id="jShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <clipPath id="rectClip1">
      <rect width="100" height="100" rx="24" />
    </clipPath>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#bgGrad1)" filter="url(#dropShadow1)" />
  <rect width="100" height="100" rx="24" fill="url(#spotlight1_1)" />
  <rect width="100" height="100" rx="24" fill="url(#spotlight1_2)" />
  <rect width="100" height="50" rx="24" fill="url(#glassGrad1)" clip-path="url(#rectClip1)" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#FFD700" stroke-opacity="0.3" stroke-width="2" />

  <path d="M 32 35 H 68 V 65 C 68 73, 62 82, 50 82 H 42 C 30 82, 24 73, 24 65 V 56" 
        fill="none" stroke="#FFD700" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#jShadow1)" />
  <path d="M 32 35 H 68 V 65 C 68 73, 62 82, 50 82 H 42 C 30 82, 24 73, 24 65 V 56" 
        fill="none" stroke="#FFD700" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1.5, -1.5)" clip-path="url(#rectClip1)" />

  <g fill="#FFD700" fill-opacity="0.8">
    <circle cx="68" cy="16" r="2.5" />
    <circle cx="76" cy="16" r="2.5" />
    <circle cx="84" cy="16" r="2.5" />
  </g>
</svg>